<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163b30">
  <meta name="description" content="Xách cần ra ao! Game câu cá Việt Nam: đọc phao, dẫn cá, sắm đồ nghề và khám phá những góc bờ mới.">
  <title>Trốn Vợ Đi Câu — Xách cần ra ao!</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./desktop.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Đến nội dung chính</a>
  <header class="game-header">
    <nav class="brand-nav" aria-label="Trang nhà"><a class="brand" href="#home" data-screen="home" aria-label="Trốn Vợ Đi Câu, về nhà"><span class="brand-icon" id="brand-icon" aria-hidden="true"></span><span>TRỐN VỢ<br><b>ĐI CÂU</b></span></a></nav>
    <div class="player-profile"><span class="profile-avatar" id="profile-avatar" aria-hidden="true"></span><div class="profile-copy"><div><strong id="profile-rank">Tân thủ</strong><span id="rank-count" class="num">0 / 5 cá</span></div><progress id="rank-progress" value="0" max="5" aria-label="Tiến độ cấp cần thủ"></progress></div></div>
    <div class="header-tools"><div class="wallet" aria-label="Số xu trong game"><span id="coin-icon" aria-hidden="true"></span><span id="wallet" class="num">12.000</span><small>xu</small></div><button class="icon-button" id="settings" aria-label="Tùy chọn và bản lưu"></button></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="game-dock" id="game-nav" aria-label="Nhà và chuẩn bị"></nav>
  <div id="live" role="status" aria-live="polite" class="sr-only"></div>
  <div id="toast" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <noscript><p class="nojs">Bật JavaScript để chơi. Game chạy ngay trong trình duyệt, không cần đăng nhập.</p></noscript>
</body>
</html>
