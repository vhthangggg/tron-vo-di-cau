name: Check game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify gameplay rules
        run: npm test
      - name: Package static game
        run: npm run build
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify packed gear and quiet fishing journey
        run: npm run test:browser:bag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-bag-browser-evidence
          path: test-results/
